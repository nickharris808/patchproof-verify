[package]
name = "patchproof-verify"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Independently re-check a patchproof elimination certificate. No solver, no Python, no trust."
license = "Apache-2.0"
repository = "https://github.com/nickharris808/patchproof-verify"
homepage = "https://github.com/nickharris808/patchproof-verify"
keywords = ["verification", "certificate", "farkas", "security", "proof"]
categories = ["command-line-utilities", "mathematics"]
readme = "README.md"

[dependencies]
serde_json = "1"

[lib]
name = "patchproof_verify"
path = "src/lib.rs"

[[bin]]
name = "patchproof-verify"
path = "src/main.rs"

[profile.release]
opt-level = "s"
